apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: demo-app
spec:
  serviceName: "mongo-headless"
  replicas: 3
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
      - name: mongo
        image: mongo:4.4.6
        command:
          - mongod
          - "--replSet"
          - rs0
          - "--bind_ip_all"
          - "--keyFile"
          - "/etc/mongo/keyfile"
        ports:
        - containerPort: 27017
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom:
            secretKeyRef:
              name: mongo-secret
              key: MONGOUSER
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mongo-secret
              key: MONGOPASSWORD
        volumeMounts:
        - name: mongo-data
          mountPath: /data/db
        - name: keyfile-volume
          mountPath: /etc/mongo
          readOnly: true
      volumes:
      - name: keyfile-volume
        secret:
          secretName: mongo-keyfile-secret
          defaultMode: 256 # 0400 in decimal is 256
  volumeClaimTemplates:
  - metadata:
      name: mongo-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: standard
      resources:
        requests:
          storage: 1Gi
